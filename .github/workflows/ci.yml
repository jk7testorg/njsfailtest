# ============================================================
# AI-Generated GitHub Actions CI/CD Workflow
# Repo: multilang-nodejs | Env: dev
# Stack: nodejs / express / npm
# AI Decisions: base=node:20-slim port=3000
# Generated by Backstage AI DevOps Scaffolder
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

env:
  APP_NAME: njsfailtest
  DOCKER_IMAGE: jaykumark7/njsfailtest
  DEPLOY_ENV: dev
  DEPLOY_NAMESPACE: dev
  APP_PORT: "3000"
  
permissions:
  contents: read
  packages: read
jobs:
  # ─────────────────────────────────────────────────────────
  # CI — Setup + Build + Test + SonarQube (all branches)
  # ─────────────────────────────────────────────────────────
  ci:
    name: CI — Build & Test
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache
        uses: actions/cache@v4
        with:
          path: node_modules/
          key: ${{ runner.os }}-npm-${{ hashFiles('**/pom.xml', '**/package.json', '**/go.sum', '**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-npm-

      # AI-decided: setup for nodejs/npm
      - name: Setup Environment
        run: |
          npm install

      # AI-decided: build
      - name: Build
        run: |
          npm run build || echo "No build script defined"

      # AI-decided: test
      - name: Run Tests
        run: |
          npm test || true

      # SonarQube — language-specific flags for nodejs
      - name: SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.APP_NAME }}
            -Dsonar.sources=. -Dsonar.exclusions=node_modules/**,coverage/**,dist/**

  # ─────────────────────────────────────────────────────────
  # CD — Docker Build + Push + GitOps Update (main only)
  # ─────────────────────────────────────────────────────────
  cd:
    name: CD — Docker & GitOps
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        run: |
          IMAGE_TAG=${{ env.DOCKER_IMAGE }}:1.0.${{ github.run_number }}
          docker build --build-arg CONTEXT_PATH=${{ env.APP_NAME }}-${{ env.DEPLOY_NAMESPACE }} -t $IMAGE_TAG -t ${{ env.DOCKER_IMAGE }}:latest .
          docker push $IMAGE_TAG
          docker push ${{ env.DOCKER_IMAGE }}:latest
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update GitOps Repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone --depth 1 https://$GH_PAT@github.com/jk7testorg/k8s-manifest.git gitops
          cd gitops
          mkdir -p argocd apps/${{ env.APP_NAME }}/${{ env.DEPLOY_ENV }}
          cp ../manifest-templates/application.yaml argocd/${{ env.APP_NAME }}-${{ env.DEPLOY_ENV }}.yaml || true
          cp ../manifest-templates/deployment.yaml  apps/${{ env.APP_NAME }}/${{ env.DEPLOY_ENV }}/ || true
          cp ../manifest-templates/service.yaml     apps/${{ env.APP_NAME }}/${{ env.DEPLOY_ENV }}/ || true
          cp ../manifest-templates/ingress.yaml     apps/${{ env.APP_NAME }}/${{ env.DEPLOY_ENV }}/ || true
          for f in apps/${{ env.APP_NAME }}/${{ env.DEPLOY_ENV }}/*.yaml argocd/${{ env.APP_NAME }}-${{ env.DEPLOY_ENV }}.yaml; do
            [ -f "$f" ] || continue
            sed -i "s|\${APP_NAME}|${{ env.APP_NAME }}|g"          "$f"
            sed -i "s|\${DOCKER_IMAGE}|${{ env.IMAGE_TAG }}|g"     "$f"
            sed -i "s|\${APP_PORT}|${{ env.APP_PORT }}|g"          "$f"
            sed -i "s|\${NAMESPACE}|${{ env.DEPLOY_NAMESPACE }}|g" "$f"
          done
          git config user.email "gha@local"
          git config user.name "GitHub Actions"
          git add .
          git diff --cached --quiet || git commit -m "[${{ env.DEPLOY_ENV }}] Deploy ${{ env.APP_NAME }} run ${{ github.run_number }}"
          git push
